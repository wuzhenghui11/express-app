<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户信息+文件上传表单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
        }
        .form-title {
            font-size: 22px;
            color: #222;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-item {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #409eff;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background-color: #337ecc;
        }
        .tip-text {
            margin-top:16px;
            font-size:14px;
            color:#666;
            text-align:center;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h2 class="form-title">信息与文件提交</h2>
        <form id="userForm">
            <div class="form-item">
                <label for="userName">用户名 userName</label>
                <input type="text" id="userName" name="userName" placeholder="请输入用户名" required>
            </div>
            <div class="form-item">
                <label for="email">邮箱 Email</label>
                <input type="email" id="email" name="email" placeholder="请输入邮箱地址" required>
            </div>
            <!-- 新增：文件上传 -->
            <div class="form-item">
                <label for="avatar">上传文件</label>
                <input type="file" id="avatar" name="avatar" required>
            </div>
            <button class="submit-btn" type="submit">提交表单</button>
        </form>
        <div class="tip-text">提交使用 FormData，支持文件上传</div>
    </div>

    <script>
        const form = document.getElementById('userForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // 直接构造 FormData，包含文本 + 文件
            const formData = new FormData(form);

            // 打印查看内容（控制台可看到文件对象）
            console.log('formData:', formData);

            // fetch 上传示例
            fetch('/api/upload', {
                method: 'POST',
                // ⚠️ 注意：使用 FormData 不要手动设置 Content-Type，浏览器会自动带上 boundary
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                alert('提交成功！');
                console.log('后端返回：', data);
            })
            .catch(err => {
                alert('提交失败');
                console.error(err);
            })
        })
    </script>
</body>
</html>
